<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Joga Bonito · Getaway</title>
  <meta name="description" content="La Joga Bonito, 30.10, Geneva. Let us know if you are coming.">
  <meta property="og:title" content="La Joga Bonito · Getaway">
  <meta property="og:description" content="30.10 · 20:00 - 02:00 · Geneva">
  <meta name="theme-color" content="#4a82b4">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #4a82b4;
      --sky-mid: #5a93c4;
      --sky-low: #a8cbe3;
      --white: #ffffff;
      --soft: rgba(255,255,255,.75);
      --line: rgba(255,255,255,.55);
      --blue-ink: #3a72a6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--sky-top); }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      font-family: 'Montserrat', system-ui, sans-serif;
      color: var(--white);
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 40%, #8dbadb 80%, var(--sky-low) 100%);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 24px 40px;
    }

    /* Haut de l'affiche */
    .top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 36px;
    }
    .top img { width: 64px; height: auto; display: block; grid-column: 2; grid-row: 1; }
    .lang { grid-column: 1; grid-row: 1; justify-self: start; font-size: 13px; letter-spacing: .08em; }
    .lang a { color: var(--soft); text-decoration: none; }
    .lang a[aria-current] { color: var(--white); font-weight: 600; }
    .city { grid-row: 1;
      grid-column: 3;
      justify-self: end;
      font-style: italic;
      font-size: 14px;
      letter-spacing: .04em;
    }

    h1 {
      font-weight: 300;
      font-size: clamp(38px, 11vw, 58px);
      line-height: 1;
      letter-spacing: -.01em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .infos {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 44px;
    }
    .date { font-weight: 300; font-size: 40px; line-height: 1; margin-bottom: 12px; }
    .when p { font-weight: 300; font-size: 15px; line-height: 1.7; }
    .lineup {
      text-align: right;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.55;
      letter-spacing: .02em;
    }

    /* Formulaire */
    form { display: flex; flex-direction: column; gap: 6px; }

    input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      color: var(--white);
      font: inherit;
      font-size: 17px;
      padding: 14px 0;
      outline: none;
      border-radius: 0;
      transition: border-color .2s;
    }
    input::placeholder { color: var(--soft); font-weight: 300; }
    input:focus { border-color: var(--white); }

    .hp { position: absolute; left: -9999px; }

    button {
      margin-top: 26px;
      background: var(--white);
      color: var(--blue-ink);
      border: none;
      border-radius: 999px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      padding: 17px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(30, 70, 110, .18);
      transition: transform .15s, box-shadow .15s, opacity .2s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(30, 70, 110, .25); }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .6; cursor: wait; }

    .msg { margin-top: 14px; font-size: 14px; min-height: 20px; }

    .done { display: none; padding: 8px 0; }
    .done h2 { font-weight: 300; font-size: 40px; text-transform: uppercase; margin-bottom: 10px; }
    .done p { font-size: 17px; font-weight: 300; }
    .done strong { font-weight: 700; }

    body.sent form, body.sent .msg { display: none; }
    body.sent .done { display: block; }

    /* Vue sur Genève */
    .view {
      margin-top: auto;
      width: 100%;
      height: clamp(280px, 62vw, 560px);
      background: url('geneve.jpg') center top / cover no-repeat;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 70px);
              mask-image: linear-gradient(to bottom, transparent 0, #000 70px);
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <nav class="lang"><a href="index.html">FR</a> · <a href="en.html" aria-current="page">EN</a></nav>
      <img src="logo.png" alt="Getaway">
      <span class="city">GENEVA</span>
    </header>

    <h1>La Joga Bonito</h1>

    <section class="infos">
      <div class="when">
        <div class="date">30.10</div>
        <p>20:00 - 02:00<br>Rue Henri-Blanvalet 11</p>
      </div>
      <div class="lineup">BIBI<br>EMIR<br>MARVIN</div>
    </section>

    <form id="rsvp" autocomplete="on">
      <input name="prenom" placeholder="First name" required maxlength="60" autocomplete="given-name">
      <input name="nom" placeholder="Last name" required maxlength="60" autocomplete="family-name">
      <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">Sign up</button>
    </form>
    <p class="msg" id="msg"></p>

    <div class="done">
      <h2>You're in</h2>
      <p>See you Friday, <strong id="who"></strong>.</p>
    </div>
  </main>

  <div class="view" role="img" aria-label="View of Geneva's harbour and the Jet d'Eau"></div>

  <script>
    // URL du Google Apps Script (liste des invités)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVip0VEmNdvU9G7qGM-fWeTTjDc-XL_IQaxa8nebnsz_RwgcqLYFfENDLXVPhvRwl3/exec';

    const form = document.getElementById('rsvp');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      if (data.get('website')) return; // anti-spam

      const btn = form.querySelector('button');
      btn.disabled = true;
      msg.textContent = '';

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: new URLSearchParams(data)
        });
        document.getElementById('who').textContent = data.get('prenom').trim();
        document.body.classList.add('sent');
      } catch (err) {
        msg.textContent = "Connection issue, please try again.";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
